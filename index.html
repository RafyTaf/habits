<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E10">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F3F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <meta name="application-name" content="Habits">
  <meta name="description" content="Weekday habit tracker">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <title>Habits</title>
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100%; min-height: 100dvh; background: #0E0E10; }
    html { color-scheme: light dark; }
    @media (prefers-color-scheme: light) {
      html, body, #root { background: #F3F3F5; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
